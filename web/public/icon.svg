<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081226"/>
      <stop offset="50%" stop-color="#0f224a"/>
      <stop offset="100%" stop-color="#06182e"/>
    </linearGradient>

    <!-- Neon Cyan Car Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Headlight / Speed Gradient -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Wheel Rim Gradient -->
    <radialGradient id="wheelRim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Modern Squircle Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGradient)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="#06b6d4" stroke-width="12" stroke-opacity="0.4"/>
  <rect x="22" y="22" width="468" height="468" rx="110" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Background Telemetry / IoT Wave Signals -->
  <path d="M 190 145 A 75 75 0 0 1 322 145" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <path d="M 220 168 A 42 42 0 0 1 292 168" fill="none" stroke="#06b6d4" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <circle cx="256" cy="185" r="8" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Speed / Ground Neon Underglow Trace -->
  <path d="M 48 382 L 464 382" stroke="url(#cyanGlow)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" opacity="0.8"/>
  <path d="M 100 398 L 412 398" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- Futuristic Sports Car Body (Aerodynamic Profile) -->
  <g filter="url(#glow)">
    <!-- Car Cabin Glass Area -->
    <path d="M 152 278 L 195 210 Q 215 198 260 198 L 332 198 Q 365 200 390 236 L 418 278 Z" 
          fill="#0c4a6e" fill-opacity="0.8" stroke="#38bdf8" stroke-width="5" stroke-linejoin="round"/>

    <!-- Window Divider Pillar (B-Pillar) -->
    <path d="M 276 200 L 268 276" stroke="#082f49" stroke-width="8" stroke-linecap="round"/>

    <!-- Main Aerodynamic Body Silhouette -->
    <path d="M 68 334 
             C 68 334, 76 308, 98 300 
             C 120 292, 142 284, 168 280
             L 198 208 
             C 216 195, 252 194, 292 194 
             L 338 194 
             C 372 195, 404 228, 426 270 
             L 456 294 
             C 472 308, 478 322, 474 340
             C 468 358, 444 360, 422 360
             C 422 334, 400 314, 372 314
             C 344 314, 322 334, 322 360
             L 196 360
             C 196 334, 174 314, 146 314
             C 118 314, 96 334, 96 360
             L 76 360
             C 68 360, 64 348, 68 334 Z" 
          fill="url(#cyanGlow)" 
          stroke="#e0f2fe" 
          stroke-width="7" 
          stroke-linejoin="round"/>

    <!-- Sport Aero Hood & Side Character Line -->
    <path d="M 148 288 C 210 286, 310 284, 436 296" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

    <!-- LED Headlight / Laser Light Beam -->
    <polygon points="452,312 472,324 456,332 444,320" fill="#fef08a" filter="url(#glow)"/>
    <path d="M 470 324 L 504 326" stroke="url(#goldLight)" stroke-width="8" stroke-linecap="round"/>

    <!-- Tail-light Ruby Glow -->
    <path d="M 72 318 L 86 322 L 76 336 Z" fill="#f43f5e" filter="url(#glow)"/>
  </g>

  <!-- Front Wheel Assembly -->
  <g transform="translate(372, 360)">
    <!-- Tire Outer -->
    <circle cx="0" cy="0" r="34" fill="#090d16" stroke="#38bdf8" stroke-width="5"/>
    <!-- Alloy Rim -->
    <circle cx="0" cy="0" r="22" fill="url(#wheelRim)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Sport Spokes -->
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="-18" y1="-9" x2="18" y2="9" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="-18" y1="9" x2="18" y2="-9" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <!-- Glowing Hub Cap Center -->
    <circle cx="0" cy="0" r="7" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Rear Wheel Assembly -->
  <g transform="translate(146, 360)">
    <!-- Tire Outer -->
    <circle cx="0" cy="0" r="34" fill="#090d16" stroke="#38bdf8" stroke-width="5"/>
    <!-- Alloy Rim -->
    <circle cx="0" cy="0" r="22" fill="url(#wheelRim)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Sport Spokes -->
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="-18" y1="-9" x2="18" y2="9" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="-18" y1="9" x2="18" y2="-9" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <!-- Glowing Hub Cap Center -->
    <circle cx="0" cy="0" r="7" fill="#38bdf8" filter="url(#glow)"/>
  </g>
</svg>