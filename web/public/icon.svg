<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Deep Tech Gradient -->
    <linearGradient id="ffmsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="50%" stop-color="#0a1931"/>
      <stop offset="100%" stop-color="#040b17"/>
    </linearGradient>

    <!-- Brand Cyan & Sapphire Gradient -->
    <linearGradient id="ffmsCyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Golden Prosperity Accent Gradient -->
    <linearGradient id="ffmsGoldGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Indigo Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Modern Squircle Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#ffmsBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="#06b6d4" stroke-width="10" stroke-opacity="0.5"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Ambient Background Light Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.25"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" opacity="0.15"/>

  <!-- Central Family Financial Shield Emblem -->
  <g filter="url(#neonGlow)">
    <!-- Shield Outer Shell -->
    <path d="M 256 96 
             L 372 144 
             C 372 260, 320 348, 256 404 
             C 192 348, 140 260, 140 144 
             Z" 
          fill="url(#shieldGrad)" 
          fill-opacity="0.85"
          stroke="url(#ffmsCyanGlow)" 
          stroke-width="8" 
          stroke-linejoin="round"/>
    
    <!-- Inner Shield Rim -->
    <path d="M 256 120 
             L 348 160 
             C 348 252, 306 324, 256 370 
             C 206 324, 164 252, 164 160 
             Z" 
          fill="none" 
          stroke="#38bdf8" 
          stroke-width="2.5" 
          stroke-opacity="0.4"/>
  </g>

  <!-- Growth Chart Pillars inside Shield (Representing Finance Accumulation) -->
  <g filter="url(#subtleGlow)">
    <!-- Bar 1 (Left) -->
    <rect x="194" y="250" width="26" height="74" rx="8" fill="#0284c7" opacity="0.85"/>
    <rect x="194" y="250" width="26" height="74" rx="8" fill="none" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Bar 2 (Middle) -->
    <rect x="243" y="205" width="26" height="119" rx="8" fill="url(#ffmsCyanGlow)"/>
    <rect x="243" y="205" width="26" height="119" rx="8" fill="none" stroke="#e0f2fe" stroke-width="2"/>

    <!-- Bar 3 (Right) -->
    <rect x="292" y="165" width="26" height="159" rx="8" fill="url(#ffmsGoldGlow)"/>
    <rect x="292" y="165" width="26" height="159" rx="8" fill="none" stroke="#fef08a" stroke-width="2"/>

    <!-- Ascending Financial Growth Trajectory Line -->
    <path d="M 180 270 
             Q 235 240, 256 200 
             T 330 145" 
          fill="none" 
          stroke="#fef08a" 
          stroke-width="7" 
          stroke-linecap="round"
          filter="url(#neonGlow)"/>

    <!-- Trajectory Arrow Head -->
    <polygon points="325,135 348,142 338,162" fill="#fef08a" filter="url(#neonGlow)"/>

    <!-- Sparkling Diamond Star (Wealth & Intelligence) at Apex -->
    <path d="M 352 140 Q 365 140 365 127 Q 365 140 378 140 Q 365 140 365 153 Q 365 140 352 140 Z" fill="#ffffff" filter="url(#neonGlow)"/>
  </g>

  <!-- Modern Acronym Badge FFMS at Base -->
  <g transform="translate(0, 20)">
    <rect x="176" y="385" width="160" height="42" rx="14" fill="#08152c" stroke="#38bdf8" stroke-width="3" opacity="0.95" filter="url(#subtleGlow)"/>
    <text x="256" y="414" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="22" 
          font-weight="900" 
          letter-spacing="4" 
          fill="#38bdf8" 
          text-anchor="middle">FFMS</text>
  </g>
</svg>